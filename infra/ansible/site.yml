---
- name: Configurar la instancia de MJ
  hosts: portfolio
  become: true
  gather_facts: false
  vars:
    project_dir: /opt/mj
    enable_vnc: false
    enable_oci_run_command: false
  tasks:
    - name: Esperar la conexión SSH
      ansible.builtin.wait_for_connection:

    - name: Recopilar información de la VM
      ansible.builtin.setup:

    - name: Verificar parámetros
      ansible.builtin.assert:
        that:
          - admin_cidr is match('^[0-9.]+/32$')
          - portfolio_domain is match('^(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,63}$')
          - portfolio_repository is match('^[a-z0-9][a-z0-9_-]*/mj-portfolio$')

    - name: Instalar Git, Caddy y herramientas del sistema
      ansible.builtin.apt:
        name: [git, caddy, curl, ca-certificates, ufw, iptables, python3-debian]
        update_cache: true
        cache_valid_time: 3600

    - name: Crear directorio de claves APT
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Descargar la clave oficial de Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Añadir el repositorio oficial de Docker
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts.distribution_release }}"
        components: [stable]
        architectures: ["{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"]
        signed_by: /etc/apt/keyrings/docker.asc
      register: docker_repository

    - name: Instalar Docker Engine y Docker Compose
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        update_cache: "{{ docker_repository.changed }}"

    - name: Activar Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Instalar escritorio y VNC opcionales
      ansible.builtin.apt:
        name: [xfce4, tigervnc-standalone-server, dbus-x11]
        install_recommends: false
      when: enable_vnc | bool

    - name: Configurar el escritorio VNC
      when: enable_vnc | bool
      block:
        - name: Crear el directorio de credenciales de VNC
          ansible.builtin.file:
            path: /etc/mj-vnc
            state: directory
            owner: ubuntu
            group: ubuntu
            mode: "0700"

        - name: Validar la contraseña de VNC
          ansible.builtin.assert:
            that: lookup('ansible.builtin.env', 'PORTFOLIO_VNC_PASSWORD') is match('^[!-~]{8}$')
          no_log: true

        - name: Guardar la contraseña de VNC
          ansible.builtin.shell: |
            set -euo pipefail
            umask 077
            password_file=$(mktemp /etc/mj-vnc/passwd.XXXXXX)
            trap 'rm -f "$password_file"' EXIT
            printf '%s\n' "$VNC_PASSWORD" | /usr/bin/tigervncpasswd -f > "$password_file"
            if ! cmp -s "$password_file" /etc/mj-vnc/passwd; then
              install -o ubuntu -g ubuntu -m 0600 "$password_file" /etc/mj-vnc/passwd
              printf 'updated\n'
            fi
          args:
            executable: /bin/bash
          environment:
            VNC_PASSWORD: "{{ lookup('ansible.builtin.env', 'PORTFOLIO_VNC_PASSWORD') }}"
          register: vnc_password_file
          changed_when: vnc_password_file.stdout == 'updated'
          no_log: true

        - name: Instalar el servicio VNC
          ansible.builtin.copy:
            src: mj-portfolio-vnc.service
            dest: /etc/systemd/system/mj-portfolio-vnc.service
            mode: "0644"
          register: vnc_unit

        - name: Activar TigerVNC en loopback
          ansible.builtin.systemd_service:
            name: mj-portfolio-vnc.service
            daemon_reload: "{{ vnc_unit.changed }}"
            enabled: true
            state: "{{ 'restarted' if vnc_unit.changed else 'started' }}"

        - name: Comprobar que VNC escucha en loopback
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: 5901
            timeout: 45

    - name: Permitir SSH administrativo y HTTP/HTTPS en el firewall iptables de UFW
      ansible.builtin.command: "ufw allow from {{ item.source }} to any port {{ item.port }} proto tcp"
      loop:
        - { source: "{{ admin_cidr }}", port: 22 }
        - { source: any, port: 80 }
        - { source: any, port: 443 }
      register: firewall_rule
      changed_when: "'Rule added' in firewall_rule.stdout"

    - name: Bloquear el tráfico entrante por defecto
      ansible.builtin.command: ufw default deny incoming
      register: firewall_default
      changed_when: "'changed' in firewall_default.stdout"

    - name: Activar UFW
      ansible.builtin.command: ufw --force enable
      register: firewall_status
      changed_when: "'enabled' in firewall_status.stdout"

    - name: Crear directorio de despliegue
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        mode: "0755"

    - name: Copiar Docker Compose
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../compose.yml"
        dest: "{{ project_dir }}/compose.yml"
        mode: "0644"

    - name: Registrar el repositorio de Docker Hub
      ansible.builtin.copy:
        content: "{{ portfolio_repository }}\n"
        dest: "{{ project_dir }}/repository"
        mode: "0644"

    - name: Inicializar imagen para el primer despliegue
      ansible.builtin.copy:
        content: "PORTFOLIO_IMAGE={{ portfolio_repository }}:latest\n"
        dest: "{{ project_dir }}/.env"
        mode: "0644"
        force: false

    - name: Instalar el comando de despliegue
      ansible.builtin.copy:
        src: deploy.sh
        dest: /usr/local/sbin/mj-portfolio-deploy
        mode: "0755"

    - name: Permitir al agente de OCI ejecutar únicamente el despliegue por digest
      ansible.builtin.copy:
        content: |
          ocarun ALL=(root) NOPASSWD: /usr/local/sbin/mj-portfolio-deploy ^sha256\\:[a-f0-9]{64}$
        dest: /etc/sudoers.d/90-mj-oci-deploy
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
      when: enable_oci_run_command | bool

    - name: Configurar Caddy para HTTPS y proxy al contenedor
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        mode: "0644"
        validate: "caddy validate --config %s --adapter caddyfile"
      notify: Recargar Caddy

    - name: Mantener Caddy activo
      ansible.builtin.systemd_service:
        name: caddy
        enabled: true
        state: started

    - name: Instalar unidades de actualización automática
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - mj-portfolio-update.service
        - mj-portfolio-update.timer
      register: portfolio_update_units

    - name: Activar la actualización automática desde Docker Hub
      ansible.builtin.systemd_service:
        name: mj-portfolio-update.timer
        daemon_reload: "{{ portfolio_update_units.changed }}"
        enabled: true
        state: "{{ 'restarted' if portfolio_update_units.changed else 'started' }}"

    - name: Desplegar el digest publicado por GitHub Actions
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/mj-portfolio-deploy
          - "{{ portfolio_deploy_digest }}"
      register: portfolio_deployment
      changed_when: "'Imagen activa:' in portfolio_deployment.stdout"
      when: portfolio_deploy_digest is defined

    - name: Comprobar la salud del portafolio en la VM
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/health
        status_code: 200
      when: portfolio_deploy_digest is defined

  handlers:
    - name: Recargar Caddy
      ansible.builtin.systemd_service:
        name: caddy
        state: reloaded
