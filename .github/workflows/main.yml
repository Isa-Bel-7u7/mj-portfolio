name: Publicar y desplegar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
  queue: max
jobs:
  tests:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/dev.yml
  publish:
    if: github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar configuración de Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ ! "$DOCKERHUB_USERNAME" =~ ^[a-z0-9]+$ ]]; then
            echo "::error::Configura DOCKERHUB_USERNAME en el repositorio de GitHub con el usuario de Docker Hub en minúsculas."
            exit 1
          fi
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Falta el secreto de repositorio DOCKERHUB_TOKEN."
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/mj-portfolio:latest
            ${{ env.DOCKERHUB_USERNAME }}/mj-portfolio:${{ github.sha }}
  deploy:
    needs: publish
    runs-on: [self-hosted, linux, portfolio-oci]
    environment: production
    timeout-minutes: 45
    env:
      TF_IN_AUTOMATION: 'true'
      OCI_STATE_PATH: ${{ vars.OCI_STATE_PATH }}
      OCI_VM_HOST: ${{ vars.OCI_VM_HOST }}
      PORTFOLIO_DOMAIN: ${{ vars.PORTFOLIO_DOMAIN }}
      PORTFOLIO_ADMIN_CIDR: ${{ vars.PORTFOLIO_ADMIN_CIDR }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      PORTFOLIO_DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verificar configuración del despliegue
        shell: bash
        run: |
          [[ "$OCI_STATE_PATH" = /* && -s "$OCI_STATE_PATH" ]]
          [[ "$OCI_VM_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$PORTFOLIO_DOMAIN" =~ ^[a-z0-9][a-z0-9.-]*\.[a-z]{2,63}$ ]]
          [[ "$PORTFOLIO_ADMIN_CIDR" =~ ^[0-9.]+/32$ ]]
          [[ "$PORTFOLIO_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
      - name: Aplicar Terraform en OCI
        shell: bash
        working-directory: infra/terraform-oci-stack
        run: |
          umask 077
          plan_dir=$(mktemp -d)
          trap 'rm -f "$plan_dir/oci.tfplan"; rmdir "$plan_dir"' EXIT
          terraform init -input=false -reconfigure -backend-config="path=$OCI_STATE_PATH"
          terraform validate
          terraform state list | grep -Fx 'oci_core_instance.generated_oci_core_instance'
          terraform plan -input=false -lock-timeout=5m -out="$plan_dir/oci.tfplan"
          terraform show -json "$plan_dir/oci.tfplan" |
            jq -e 'all(.resource_changes[]?; (.change.actions | index("delete")) == null)' >/dev/null
          terraform apply -input=false -lock-timeout=5m "$plan_dir/oci.tfplan"
      - name: Configurar la VM y desplegar la imagen con Ansible
        shell: bash
        env:
          PORTFOLIO_VNC_PASSWORD: ${{ secrets.PORTFOLIO_VNC_PASSWORD }}
        run: |
          [[ "$PORTFOLIO_VNC_PASSWORD" =~ ^[[:graph:]]{8}$ ]]
          umask 077
          inventory=$(mktemp)
          trap 'rm -f "$inventory"' EXIT
          printf '[portfolio]\nportfolio ansible_host=%s ansible_user=ubuntu\n' "$OCI_VM_HOST" > "$inventory"
          variables=$(jq -cn \
            --arg domain "$PORTFOLIO_DOMAIN" \
            --arg cidr "$PORTFOLIO_ADMIN_CIDR" \
            --arg repository "$DOCKERHUB_USERNAME/mj-portfolio" \
            --arg digest "$PORTFOLIO_DIGEST" \
            '{portfolio_domain:$domain, admin_cidr:$cidr, portfolio_repository:$repository, portfolio_deploy_digest:$digest, enable_vnc:true}')
          ANSIBLE_HOST_KEY_CHECKING=True ansible-playbook -i "$inventory" infra/ansible/site.yml -e "$variables"
      - name: Verificar el dominio público por HTTPS
        run: curl --fail --silent --show-error --retry 8 --retry-all-errors --max-time 15 "https://$PORTFOLIO_DOMAIN/api/health"
