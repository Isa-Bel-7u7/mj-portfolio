name: Publicar y desplegar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
  queue: max
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/mj-portfolio:latest
            ${{ vars.DOCKERHUB_USERNAME }}/mj-portfolio:${{ github.sha }}
  deploy:
    needs: publish
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_INSTANCE_ID != '' && vars.AWS_REGION != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Desplegar el digest publicado y esperar el resultado
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          command_id=$(aws ssm send-command --document-name mj-portfolio-deploy \
            --instance-ids "$INSTANCE_ID" --parameters "Digest=$IMAGE_DIGEST" \
            --query 'Command.CommandId' --output text)
          for attempt in {1..60}; do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null) || status=Pending
            case "$status" in
              Success) exit 0 ;;
              Pending|InProgress|Delayed|Cancelling) sleep 5 ;;
              *) aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID"; exit 1 ;;
            esac
          done
          echo "Tiempo de espera agotado para SSM ($command_id)"
          exit 1
