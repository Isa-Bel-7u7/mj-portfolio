name: Publicar y desplegar
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_oci:
        description: Ejecutar el despliegue en Oracle Cloud en esta ejecución
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
  queue: max
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar configuración de Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ ! "$DOCKERHUB_USERNAME" =~ ^[a-z0-9]+$ ]]; then
            echo "::error::Configura DOCKERHUB_USERNAME en el repositorio de GitHub con el usuario de Docker Hub en minúsculas."
            exit 1
          fi
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Falta el secreto de repositorio DOCKERHUB_TOKEN."
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/mj-portfolio:latest
            ${{ env.DOCKERHUB_USERNAME }}/mj-portfolio:${{ github.sha }}
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Comprobar activación del despliegue
        id: deployment
        env:
          OCI_DEPLOY_ENABLED: ${{ vars.OCI_DEPLOY_ENABLED }}
          DEPLOY_REQUESTED: ${{ inputs.deploy_oci }}
        run: |
          if [[ "${DEPLOY_REQUESTED}" == true || "${OCI_DEPLOY_ENABLED,,}" == true ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [[ -z "$OCI_DEPLOY_ENABLED" ]]; then
            echo "::notice::GitHub no entregó la variable de repositorio OCI_DEPLOY_ENABLED. El despliegue no se ejecutará."
          else
            echo "::notice::OCI_DEPLOY_ENABLED no tiene el valor true. El despliegue no se ejecutará."
          fi
      - uses: actions/checkout@v4
        if: steps.deployment.outputs.enabled == 'true'
      - name: Instalar OCI CLI
        if: steps.deployment.outputs.enabled == 'true'
        run: pipx install oci-cli
      - name: Desplegar la imagen por digest en Oracle Cloud
        if: steps.deployment.outputs.enabled == 'true'
        env:
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_COMPARTMENT_ID: ${{ vars.OCI_COMPARTMENT_ID }}
          OCI_INSTANCE_ID: ${{ vars.OCI_INSTANCE_ID }}
          OCI_TENANCY: ${{ vars.OCI_TENANCY }}
          OCI_USER: ${{ vars.OCI_USER }}
          OCI_FINGERPRINT: ${{ vars.OCI_FINGERPRINT }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          for key in OCI_REGION OCI_COMPARTMENT_ID OCI_INSTANCE_ID OCI_TENANCY OCI_USER OCI_FINGERPRINT OCI_API_PRIVATE_KEY; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Falta configurar $key."
              exit 1
            fi
          done
          umask 077
          config_dir=$(mktemp -d)
          trap 'rm -rf "$config_dir"' EXIT
          printf '%s\n' "$OCI_API_PRIVATE_KEY" > "$config_dir/key.pem"
          unset OCI_API_PRIVATE_KEY
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=%s\n' \
            "$OCI_USER" "$OCI_FINGERPRINT" "$OCI_TENANCY" "$OCI_REGION" "$config_dir/key.pem" > "$config_dir/config"
          export OCI_CLI_CONFIG_FILE="$config_dir/config"
          bash infra/oci/deploy.sh
